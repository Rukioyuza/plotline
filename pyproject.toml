[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plotline"
version = "0.1.0"
description = "Small zero-dependency charts rendered to SVG, with a text preview."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rukioyuza" }]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
